<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Distill - Small Promo Tile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    width: 440px;
    height: 280px;
    overflow: hidden;
    background: #0f0c29;
  }

  body {
    width: 440px;
    height: 280px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 50% 30%, rgba(108, 92, 231, 0.25) 0%, transparent 60%);
  }

  .content {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #6C5CE7, #a29bfe);
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg {
    width: 26px;
    height: 26px;
  }

  .logo-text {
    font-size: 34px;
    font-weight: 700;
    color: white;
    letter-spacing: -0.5px;
  }

  .tagline {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 22px;
  }

  .pills {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.7);
    font-weight: 500;
  }

  .pill-icon {
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="content">
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 4h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="rgba(255,255,255,0.9)"/>
          <path d="M14 4v5h5" fill="none" stroke="rgba(108,92,231,0.6)" stroke-width="1.5"/>
          <path d="M9 13l2 2 4-4" stroke="#6C5CE7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="logo-text">Distill</span>
    </div>
    <p class="tagline">AI Summaries & Chat for YouTube</p>
    <div class="pills">
      <div class="pill"><span class="pill-icon">&#x26A1;</span> Summaries</div>
      <div class="pill"><span class="pill-icon">&#x1F4AC;</span> Chat</div>
      <div class="pill"><span class="pill-icon">&#x1F4CB;</span> Transcripts</div>
    </div>
  </div>
</body>
</html>
